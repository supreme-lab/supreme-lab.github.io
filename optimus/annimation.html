<script>
// ── roundRect polyfill ────────────────────────────────────────────────────────
(function(){
  if (CanvasRenderingContext2D.prototype.roundRect) return;
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (typeof r === 'number') r = [r,r,r,r];
    else if (!Array.isArray(r)) r = [0,0,0,0];
    while (r.length < 4) r.push(r[r.length-1]);
    var tl=Math.max(0,r[0]||0), tr=Math.max(0,r[1]||0),
        br=Math.max(0,r[2]||0), bl=Math.max(0,r[3]||0);
    this.moveTo(x+tl,y);
    this.lineTo(x+w-tr,y);    this.arcTo(x+w,y,    x+w,y+tr,   tr);
    this.lineTo(x+w,y+h-br);  this.arcTo(x+w,y+h,  x+w-br,y+h, br);
    this.lineTo(x+bl,y+h);    this.arcTo(x,y+h,    x,y+h-bl,   bl);
    this.lineTo(x,y+tl);      this.arcTo(x,y,      x+tl,y,      tl);
    this.closePath(); return this;
  };
})();

// ── math ──────────────────────────────────────────────────────────────────────
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function easeIO(t){ return t<.5?2*t*t:1-(2-2*t)*(2-2*t)/2; }
function easeOut(t){ return 1-(1-t)*(1-t)*(1-t); }
function win(c,a,b){ return clamp((c-a)/(b-a),0,1); }
function bezPt(t,p0,p1,p2,p3){
  var u=1-t;
  return { x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
           y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y };
}
function fadeA(p){ return p<.12?p/.12:p>.82?(1-p)/.18:1; }

// ── draw primitives ───────────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,sw){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r||0);
  if(fill){   ctx.fillStyle=fill;   ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=sw||1; ctx.stroke(); }
}
function txt(s,x,y,size,weight,color,align,mono){
  ctx.fillStyle=color||C.ink; ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.font=(weight||'400')+' '+(size||9)+"px '"+(mono?'JetBrains Mono':'DM Sans')+"'";
  ctx.fillText(s,x,y);
}
function bezPipe(x0,y0,cx1,cy1,cx2,cy2,x1,y1,col,w){
  ctx.save(); ctx.strokeStyle=col||C.border; ctx.lineWidth=w||1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x0,y0);
  ctx.bezierCurveTo(cx1,cy1,cx2,cy2,x1,y1);
  ctx.stroke(); ctx.restore();
}
function tokenCard(tp,p0,cp1,cp2,p3,label,color,alpha,tw){
  var pos=bezPt(easeIO(clamp(tp,0,1)),p0,cp1,cp2,p3), th=24; tw=tw||104;
  ctx.save(); ctx.globalAlpha=alpha||1;
  rr(pos.x-tw/2,pos.y-th/2,tw,th,4,'white',color,1.5);
  rr(pos.x-tw/2,pos.y-th/2,3,th,[4,0,0,4],color,null);
  txt(label,pos.x+2,pos.y,7.5,'500',color,'center',true);
  ctx.restore();
}

}

// ── background + phase outlines ───────────────────────────────────────────────
function drawBg(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=C.grid; ctx.lineWidth=1;
  for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Phase 1 outline (up to rank start)
  ctx.save();
  ctx.strokeStyle=C.navy+'44'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.roundRect(6,6,540,H-12,6); ctx.stroke();
  txt('PHASE 1: COMPOSITION & SYNTHESIS',274,20,8,'600',C.navy+'99','center',true);

  txt('PHASE 2: OPTIMUS SCORING CORE',955,20,8,'600',C.red+'99','center',true);
  ctx.restore();
}

  ms.forEach(function(m,i){
    txt(m.k+':',  x+12,y+44+i*40,8,'400',C.faint,'left',true);
    txt(m.v,      x+w-10,y+44+i*40,9,'600',m.c,'right',true);
  });
  txt('vs. AutoDAN PPL 105–142',x+w/2,y+h-30,7,'400',C.faint);
  txt('↑ fluency  ↑ evasion',   x+w/2,y+h-14,7.5,'500',C.green);
}

// ── DYNAMIC OVERLAYS ──────────────────────────────────────────────────────────
function drawDynamic(cycle){
  var i, p, yy, col;
  var bcat=B.cat, bopt=B.opt, brank=B.rank, bft=B.ft;

  // ─ 1. LLM vote labels appear one by one (cycle 0.36–0.56) ─
  for(i=0;i<6;i++){
    var vs=0.36+i*0.032;
    p=easeOut(win(cycle,vs,vs+0.05));
    if(p<=0) continue;
    ctx.save(); ctx.globalAlpha=p;
    yy=bcat[1]+32+i*40;
    rr(bcat[0]+bcat[2]-48,yy+4,40,22,3,LLM_COLS[i],null);
    txt(VOTE_LBLS[i],bcat[0]+bcat[2]-28,yy+16,9,'600','white','center',true);
    ctx.restore();
  }

  // ─ 2. Majority vote banner (cycle 0.60–0.70) ─
  p=easeOut(win(cycle,0.60,0.68));
  if(p>0){
    ctx.save(); ctx.globalAlpha=p;
    rr(bcat[0]+5,bcat[1]+bcat[3]-38,bcat[2]-10,28,3,C.blue+'22',C.blue,2);
    txt('→ A7: Malware  (4/6 votes)',bcat[0]+bcat[2]/2,bcat[1]+bcat[3]-24,8.5,'600',C.blue,'center',true);
    ctx.restore();
  }

  // ─ 3. Optimus S bar (cycle 0.44–0.58) ─
  var sV=0.62, sp=easeOut(win(cycle,0.44,0.58));
  if(sp>0){
    rr(bopt[0]+5,bopt[1]+81,(bopt[2]-10)*sV*sp,10,5,C.blue,null);
    ctx.save(); ctx.globalAlpha=sp;
    txt('S='+(sV*sp).toFixed(2),bopt[0]+bopt[2]-7,bopt[1]+86,8,'600',C.blue,'right',true);
    ctx.restore();
  }

  // ─ 4. Optimus H bar (cycle 0.50–0.63) ─
  var hV=0.41, hp=easeOut(win(cycle,0.50,0.63));
  if(hp>0){
    rr(bopt[0]+5,bopt[1]+113,(bopt[2]-10)*hV*hp,10,5,C.red,null);
    ctx.save(); ctx.globalAlpha=hp;
    txt('H='+(hV*hp).toFixed(2),bopt[0]+bopt[2]-7,bopt[1]+118,8,'600',C.red,'right',true);
    ctx.restore();
  }

  // ─ 5. Score pointer sweep (cycle 0.58–0.70) ─
  var jV=0.38, jp=easeOut(win(cycle,0.58,0.70));
  if(jp>0){
    var px=bopt[0]+5+(bopt[2]-10)*jV*jp;
    ctx.save(); ctx.globalAlpha=jp;
    rr(px-1.5,bopt[1]+141,3,20,1,C.ink,null);
    txt('J='+(jV*jp).toFixed(2),px,bopt[1]+172,8,'600',C.ink,'center',true);
    ctx.restore();
  }

  // ─ 6. STRATEGY RANKING BARS (cycle 0.36–0.72, simultaneous with categorization) ─
  // Each row's 3 strategy bars fill in progressively, staggered per row
  RANK_ROWS.forEach(function(row,i){
    var rowStart = 0.36 + i*0.028;   // stagger each category row
    var rowP     = win(cycle, rowStart, rowStart+0.08);  // row appear progress
    if(rowP<=0) return;
    var ry = ROW_Y0 + i*ROW_H;
    var rx = brank[0]+94;
    var barW = brank[2]-104;

    // Fill each of the 3 strategy bars
    for(var j=0;j<3;j++){
      var barStart = rowStart + j*0.025;
      var barP = easeOut(win(cycle, barStart, barStart+0.06));
      if(barP<=0) continue;
      // bar track is drawn statically; just fill the colored portion
      rr(rx, ry+10+j*16, barW*row.scores[j]*barP, 10, 3, row.col+(j===0?'':'55'), null);
      // strategy label appears with bar
      ctx.save(); ctx.globalAlpha=barP;
      // tiny label on bar
      var lbl=row.top[j].length>14?row.top[j].slice(0,13)+'…':row.top[j];
      txt(lbl, rx+3, ry+15+j*16, 6.5,'400',j===0?'white':row.col,'left',true);
      // score on right
      txt(row.scores[j].toFixed(2), brank[0]+brank[2]-6, ry+15+j*16, 6.5,'600',row.col,'right',true);
      ctx.restore();
    }

    // Row fade-in alpha
    ctx.save(); ctx.globalAlpha = easeOut(rowP);
    // Mean score chip on right of category badge
    rr(brank[0]+10, ry+34, 76, 16, 3, row.col+'14', null);
    txt('mean J='+row.score.toFixed(3), brank[0]+48, ry+42, 6,'400',row.col,'center',true);
    ctx.restore();
  });

  // ─ 7. Gold highlight on A7 Malware row when vote resolves (cycle 0.62+) ─
  var highlight = easeOut(win(cycle, 0.62, 0.70));
  if(highlight>0){
    var malIdx=3; // A7 Malware is index 3 in RANK_ROWS
    var ry2=ROW_Y0+malIdx*ROW_H;
    ctx.save(); ctx.globalAlpha=highlight*0.18;
    rr(brank[0]+4,ry2,brank[2]-8,ROW_H-3,3,C.gold,null);
    ctx.restore();
    ctx.save(); ctx.globalAlpha=highlight;
    // "CURRENT PROMPT" badge
    rr(brank[0]+brank[2]-68,ry2+4,64,16,3,C.gold,null);
    txt('← THIS PROMPT',brank[0]+brank[2]-36,ry2+12,6,'600','white','center',true);
    ctx.restore();
  }

  // ─ 8. Tier flash: Moderate row lights up ─
  var tf=win(cycle,0.76,0.82);
  if(tf>0&&tf<1){
    var btier=B.tier, ymod=btier[1]+36+2*128;
    ctx.save(); ctx.globalAlpha=Math.sin(tf*Math.PI)*0.28;
    rr(btier[0]+5,ymod,btier[2]-10,112,4,C.gold,null);
    ctx.restore();
  }

  // ─ 9. FineTune progress bar ─
  var ftp=easeOut(win(cycle,0.84,0.97));
  rr(bft[0]+6,bft[1]+bft[3]-52,bft[2]-12,8,4,'rgba(255,255,255,.12)',null);
  if(ftp>0){
    ctx.save();
    var fg=ctx.createLinearGradient(bft[0]+6,0,bft[0]+bft[2]-6,0);
    fg.addColorStop(0,'#60a5fa'); fg.addColorStop(1,'#3b82f6');
    ctx.fillStyle=fg; ctx.beginPath();
    ctx.roundRect(bft[0]+6,bft[1]+bft[3]-52,(bft[2]-12)*ftp,8,4); ctx.fill();
    ctx.globalAlpha=ftp;
    txt((ftp*100).toFixed(0)+'% trained',bft[0]+bft[2]/2,bft[1]+bft[3]-60,7,'400','rgba(255,255,255,.6)');
    ctx.restore();
  }

  // ─ 10. "OPTIMAL STRATEGY SELECTED" label in rank panel after highlight ─
  var selP=easeOut(win(cycle,0.68,0.76));
  if(selP>0){
    ctx.save(); ctx.globalAlpha=selP;
    rr(brank[0]+6,brank[1]+brank[3]-32,brank[2]-12,26,3,C.navyM,null);
    txt('✓ Best strategies selected → Fine-Tuning',brank[0]+brank[2]/2,brank[1]+brank[3]-19,7.5,'600','white','center',true);
    ctx.restore();
  }
}

function drawTokens(cycle){
  TOKENS.forEach(function(tk){
    var cs=tk[0],ce=tk[1],p0=tk[2],cp1=tk[3],cp2=tk[4],p3=tk[5];
    var label=tk[6],color=tk[7],tw=tk[8];
    if(cycle<cs||cycle>ce+0.04) return;
    var t=clamp((cycle-cs)/(ce-cs),0,1);
    tokenCard(t,p0,cp1,cp2,p3,label,color,fadeA(t),tw);
  });
}

// ── STAGE LABELS ──────────────────────────────────────────────────────────────
var STAGES=[
  [0.00,0.09,'① Strategy & seed cards emerge from source databases'],
  [0.09,0.23,'② Cards flow to Compose operator  (s_i × q_k  →  j_{i,k})'],
  [0.23,0.38,'③ Composed prompt splits → Categorize  +  Optimus paths'],
  [0.36,0.62,'④ 6 LLMs vote simultaneously — strategy bars fill per category'],
  [0.44,0.68,'⑤ Optimus computes S=0.62, H=0.41 → J=0.38  (MODERATE)'],
  [0.62,0.76,'⑥ A7: Malware identified → optimal strategies highlighted in ranking'],
  [0.76,0.87,'⑦ Ranked prompt → Tier → Moderate + Optimal selected for training'],
  [0.87,0.97,'⑧ Instruction Fine-Tuning  (LoRA · DoRA · 24,220 samples)'],
  [0.97,1.00,'⑨ Generator LLM attacks victim models  (ASR 0.84–0.98, PPL 24–39)'],
];
function stageName(c){
  for(var i=0;i<STAGES.length;i++) if(c>=STAGES[i][0]&&c<STAGES[i][1]) return STAGES[i][2];
  return STAGES[0][2];
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function frame(ts){
  var elapsed = paused ? pauseAt : (ts-t0)/1000;
  var cycle   = (elapsed%CYCLE)/CYCLE;

  drawBg();
  drawPipes();
  drawWild(); drawJBV(); drawCompose();
  drawCategorize(); drawOptimus();
  drawRankStatic();
  drawTier(); drawFT(); drawOut();
  drawDynamic(cycle);
  drawTokens(cycle);

  document.getElementById('stageLabel').textContent = stageName(cycle);
  document.getElementById('pct').textContent='cycle '+(cycle*100).toFixed(0)+'%  ·  t='+(elapsed%CYCLE).toFixed(1)+'s';

  requestAnimationFrame(frame);
}

function restart(){
  t0=performance.now(); pauseAt=0; paused=false;
  document.getElementById('pauseBtn').textContent='⏸ Pause';
}
function togglePause(){
  if(paused){ t0=performance.now()-pauseAt*1000; paused=false;
    document.getElementById('pauseBtn').textContent='⏸ Pause';
  } else { pauseAt=(performance.now()-t0)/1000; paused=true;
    document.getElementById('pauseBtn').textContent='▶ Resume';
  }
}

requestAnimationFrame(frame);
</script>
